@if (httpErrors.notice(); as notice) {
  <div class="global-error" role="alert">
    <span>{{ notice.message }}</span>
    <button type="button" (click)="httpErrors.clear()">Dismiss</button>
  </div>
}

@if (isLoginPage()) {
  <router-outlet />
} @else {
  <div class="app-layout">
    <app-sidebar />
    <div class="app-main">
      <app-header />
      <main class="app-content">
        <router-outlet />
      </main>
    </div>
  </div>
}
